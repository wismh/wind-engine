plugins {
    id 'com.android.application'
}

def engineDir = project.hasProperty('ENGINE_SOURCE_DIR')
        ? file(ENGINE_SOURCE_DIR).absolutePath
        : (System.getenv('ENGINE_SOURCE_DIR') ?: file('../../..').absolutePath)
def cmakeLists = project.hasProperty('ENGINE_ANDROID_CMAKE')
        ? file(ENGINE_ANDROID_CMAKE).absolutePath
        : (System.getenv('ENGINE_ANDROID_CMAKE') ?: file("${engineDir}/CMakeLists.txt").absolutePath)
def hostCodegen = project.hasProperty('ENGINE_HOST_ASSET_CODEGEN')
        ? ENGINE_HOST_ASSET_CODEGEN
        : (System.getenv('ENGINE_HOST_ASSET_CODEGEN') ?: '')
def withAudio = project.hasProperty('ENGINE_WITH_AUDIO')
        ? ENGINE_WITH_AUDIO
        : (System.getenv('ENGINE_WITH_AUDIO') ?: 'OFF')
// Game-supplied res overlay (mipmap-*/ic_launcher.png, values/strings.xml app_name) merged over
// the engine's own res/ by AGP's standard resource merger — see SDD §19.4. Empty means no overlay,
// i.e. every game keeps shipping the engine's own icon/name until it supplies one.
def gameResDir = project.hasProperty('ENGINE_ANDROID_RES_DIR')
        ? file(ENGINE_ANDROID_RES_DIR).absolutePath
        : (System.getenv('ENGINE_ANDROID_RES_DIR') ?: '')
def gameApplicationId = project.hasProperty('ENGINE_ANDROID_APPLICATION_ID')
        ? ENGINE_ANDROID_APPLICATION_ID
        : (System.getenv('ENGINE_ANDROID_APPLICATION_ID') ?: '')
def sdlJava = "${engineDir}/external/SDL3/android-project/app/src/main/java"
// Same directory CMake stages via -DENGINE_ANDROID_ASSETS_OUT (do not point at engine/build-android).
def apkAssets = project.hasProperty('ENGINE_ANDROID_ASSETS_OUT')
        ? file(ENGINE_ANDROID_ASSETS_OUT)
        : file("${project.buildDir}/wind-assets")

android {
    namespace 'org.windengine.app'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId gameApplicationId ?: 'org.windengine.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-21',
                        '-DANDROID_STL=c++_shared',
                        '-DENGINE_WITH_WINDOW=ON',
                        '-DENGINE_WITH_ANDROID=ON',
                        "-DENGINE_WITH_AUDIO=${withAudio}",
                        '-DENGINE_BUILD_TESTS=OFF',
                        "-DENGINE_ANDROID_ASSETS_OUT=${apkAssets.absolutePath}"
                if (hostCodegen) {
                    arguments.add("-DENGINE_HOST_ASSET_CODEGEN=${hostCodegen}")
                }
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdlJava]
            assets.srcDirs += [apkAssets]
            if (gameResDir) {
                res.srcDirs += [gameResDir]
            }
        }
    }

    applicationVariants.all { variant ->
        tasks.matching { it.name == "merge${variant.name.capitalize()}Assets" }.configureEach {
            dependsOn "externalNativeBuild${variant.name.capitalize()}"
        }
    }

    externalNativeBuild {
        cmake {
            path cmakeLists
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
