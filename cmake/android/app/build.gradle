plugins {
    id 'com.android.application'
}

def engineDir = project.hasProperty('ENGINE_SOURCE_DIR')
        ? file(ENGINE_SOURCE_DIR).absolutePath
        : (System.getenv('ENGINE_SOURCE_DIR') ?: file('../../..').absolutePath)
def cmakeLists = project.hasProperty('ENGINE_ANDROID_CMAKE')
        ? file(ENGINE_ANDROID_CMAKE).absolutePath
        : (System.getenv('ENGINE_ANDROID_CMAKE') ?: file("${engineDir}/CMakeLists.txt").absolutePath)
def hostCodegen = project.hasProperty('ENGINE_HOST_ASSET_CODEGEN')
        ? ENGINE_HOST_ASSET_CODEGEN
        : (System.getenv('ENGINE_HOST_ASSET_CODEGEN') ?: '')
def hostIconCodegen = project.hasProperty('ENGINE_HOST_ICON_CODEGEN')
        ? ENGINE_HOST_ICON_CODEGEN
        : (System.getenv('ENGINE_HOST_ICON_CODEGEN') ?: '')
def withAudio = project.hasProperty('ENGINE_WITH_AUDIO')
        ? ENGINE_WITH_AUDIO
        : (System.getenv('ENGINE_WITH_AUDIO') ?: 'OFF')
// Game-supplied res overlay (mipmap-*/ic_launcher.png only) merged over the engine's own res/ by
// AGP's standard resource merger — see SDD §19.4. Empty means no overlay, i.e. every game keeps
// shipping the engine's own icon until it supplies one. app_name does NOT go through this path:
// a values/strings.xml here would redeclare the same string/app_name the engine's own res/
// already defines, which AAPT2 treats as a hard "Duplicate resources" error rather than an
// override (multiple res.srcDirs in one sourceSet merge as siblings, not an overlay chain — real
// override precedence only exists between build-variant sourceSets and main). App name is
// instead a manifestPlaceholder (see AndroidManifest.xml's android:label="${appName}").
def gameResDir = project.hasProperty('ENGINE_ANDROID_RES_DIR')
        ? file(ENGINE_ANDROID_RES_DIR).absolutePath
        : (System.getenv('ENGINE_ANDROID_RES_DIR') ?: '')
def gameApplicationId = project.hasProperty('ENGINE_ANDROID_APPLICATION_ID')
        ? ENGINE_ANDROID_APPLICATION_ID
        : (System.getenv('ENGINE_ANDROID_APPLICATION_ID') ?: '')
def gameAppName = project.hasProperty('ENGINE_ANDROID_APP_NAME')
        ? ENGINE_ANDROID_APP_NAME
        : (System.getenv('ENGINE_ANDROID_APP_NAME') ?: '')
def sdlJava = "${engineDir}/external/SDL3/android-project/app/src/main/java"
// Same directory CMake stages via -DENGINE_ANDROID_ASSETS_OUT (do not point at engine/build-android).
def apkAssets = project.hasProperty('ENGINE_ANDROID_ASSETS_OUT')
        ? file(ENGINE_ANDROID_ASSETS_OUT)
        : file("${project.buildDir}/wind-assets")

android {
    namespace 'org.windengine.app'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId gameApplicationId ?: 'org.windengine.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [appName: gameAppName ?: 'Wind']
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-21',
                        '-DANDROID_STL=c++_shared',
                        '-DENGINE_WITH_WINDOW=ON',
                        '-DENGINE_WITH_ANDROID=ON',
                        "-DENGINE_WITH_AUDIO=${withAudio}",
                        '-DENGINE_BUILD_TESTS=OFF',
                        "-DENGINE_ANDROID_ASSETS_OUT=${apkAssets.absolutePath}"
                if (hostCodegen) {
                    arguments.add("-DENGINE_HOST_ASSET_CODEGEN=${hostCodegen}")
                }
                if (hostIconCodegen) {
                    arguments.add("-DENGINE_HOST_ICON_CODEGEN=${hostIconCodegen}")
                }
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdlJava]
            assets.srcDirs += [apkAssets]
        }
        // Build-variant sourceSets (debug/release) win over main's own resources of the same
        // name — sibling dirs added to main.res.srcDirs do not (AAPT2 hard-fails as "Duplicate
        // resources" instead, which is what broke this overlay once wind-62 shipped a default
        // mipmap/ic_launcher in the engine's own main res/). Registering the game's overlay on
        // both debug and release, rather than main, gets the real override precedence.
        if (gameResDir) {
            debug {
                res.srcDirs += [gameResDir]
            }
            release {
                res.srcDirs += [gameResDir]
            }
        }
    }

    applicationVariants.all { variant ->
        tasks.matching { it.name == "merge${variant.name.capitalize()}Assets" }.configureEach {
            dependsOn "externalNativeBuild${variant.name.capitalize()}"
        }
    }

    externalNativeBuild {
        cmake {
            path cmakeLists
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
