<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wind</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body {
      margin: 0;
      background: #111;
      color: #ddd;
      font-family: sans-serif;
      overflow-x: hidden;
    }
    #status {
      text-align: center;
      padding: 8px;
      font-size: 14px;
    }
    #canvas {
      display: block;
      margin: 0 auto;
      background: #000;
      outline: none;
      /* IGame::window_size() sets the canvas's drawing-buffer width/height attributes in real
         px (e.g. 576) via SDL3's Emscripten backend; without this, a viewport narrower than
         that (any phone) overflows horizontally instead of shrinking. max-width/height:auto
         treats it like a replaced element (same as an <img>) - shrinks to fit, preserving the
         drawing buffer's own aspect ratio, never grows past its native size on a wide desktop
         window. */
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      setStatus: function (text) {
        var el = document.getElementById('status');
        if (el) {
          el.textContent = text || '';
        }
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
