name: Release

# Every push to main is a release: the next version (tools/ci/next_version.py), the editor SDK of that version built on
# Linux, macOS, and Windows with the same steps as sdk.yml, and one GitHub Release v<version> with the three archives and
# their .sha256 once all three passed. The major, the minor, and the stage are in the root CMakeLists.txt; the patch is
# counted here. docs/tech/build/Release.md

on:
  push:
    branches: [main]
  # A dry run on any branch: everything but the publish job. gh workflow run release.yml --ref <branch> -f publish=false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release (false is a dry run)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.next.outputs.version }}
      patch: ${{ steps.next.outputs.patch }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        id: next
        run: python3 tools/ci/next_version.py --github-output

  sdk:
    name: SDK ${{ needs.version.outputs.version }} (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04, os: linux, arch: x86_64 }
          - { name: macOS, runner: macos-15, os: macos, arch: arm64 }
          # tests/cli_server_test.cpp does not compile with Visual Studio 2022's MSVC; the compiler is Visual Studio 2026.
          # The generator is Ninja Multi-Config (preset vs-editor).
          - { name: Windows, runner: windows-2025-vs2026, os: windows, arch: x86_64 }
    env:
      WIND_VERSION: ${{ needs.version.outputs.version }}
      WIND_PATCH: ${{ needs.version.outputs.patch }}
      WIND_ARTIFACT: wind-sdk-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libgl1-mesa-dri libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
      - name: Ninja
        if: matrix.os == 'windows'
        shell: pwsh
        run: powershell -File tools/ci/ensure_ninja.ps1
      - name: MSVC
        if: matrix.os == 'windows'
        shell: pwsh
        run: powershell -File tools/ci/msvc_env.ps1
      - name: Configure
        if: matrix.os != 'windows'
        run: cmake --preset ${{ matrix.os }}-editor -DENGINE_VERSION_PATCH=${WIND_PATCH}
      - name: Configure
        if: matrix.os == 'windows'
        shell: pwsh
        run: cmake --preset vs-editor "-DENGINE_VERSION_PATCH=$env:WIND_PATCH"
      - name: Build
        run: cmake --build build-editor --config Release --parallel
      - name: Tests
        if: matrix.os == 'linux'
        run: xvfb-run -a ctest --test-dir build-editor -C Release --output-on-failure --parallel 4
      - name: Tests
        if: matrix.os != 'linux'
        run: ctest --test-dir build-editor -C Release --output-on-failure --parallel 4
      # Three packages per platform. The SDK is the install without the components "symbols" (the .pdb files, Windows) and
      # "source" (<sdk>/source, one package for every platform, made on Linux); tools/ci/split_symbols.py then takes the
      # debug information out of what is left (the player libraries, the Linux and macOS binaries) into out/symbols.
      - name: Install the SDK
        run: cmake --install build-editor --config Release --prefix out/sdk --component Unspecified
      - name: Install the symbols
        if: matrix.os == 'windows'
        shell: bash
        run: cmake --install build-editor --config Release --prefix out/symbols --component symbols
      - name: Split the symbols off the SDK
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" tools/ci/split_symbols.py --os ${{ matrix.os }} --sdk out/sdk --symbols out/symbols
          test -f out/symbols/symbols.toml || { echo "no symbols were split"; exit 1; }
          cat out/symbols/symbols.toml
          test -z "$(find out/sdk -name '*.pdb' -path '*/bin/*')" || { echo ".pdb files in the SDK"; exit 1; }
          test ! -e out/sdk/source || { echo "source/ in the SDK"; exit 1; }
      - name: Install the source
        if: matrix.os == 'linux'
        run: |
          cmake --install build-editor --config Release --prefix out/source --component source
          test -f out/source/source.toml
      - name: The SDK is this version, from a clean checkout
        shell: bash
        run: |
          grep -qx "version = \"${WIND_VERSION}\"" out/sdk/sdk.toml || { cat out/sdk/sdk.toml; echo "sdk.toml: wrong version"; exit 1; }
          grep -qx "dirty = false" out/sdk/sdk.toml || { cat out/sdk/sdk.toml; echo "sdk.toml: the checkout was dirty"; exit 1; }
          grep -qx "platform = \"${{ matrix.os }}\"" out/sdk/sdk.toml || { cat out/sdk/sdk.toml; echo "sdk.toml: wrong platform"; exit 1; }
      - name: Game against the SDK
        if: matrix.os != 'windows'
        run: tools/ci/sdk_smoke.sh out/sdk out/smoke
      - name: Editor plays the game
        if: matrix.os != 'windows'
        # A CI machine has no sound card: SDL's dummy driver stands in, or the editor refuses to start.
        env:
          SDL_AUDIODRIVER: dummy
        run: ${{ matrix.os == 'linux' && 'xvfb-run -a ' || '' }}tools/ci/sdk_smoke.sh out/sdk out/smoke-e2e --e2e
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist
          pack() {  # <directory under out/> <archive name without the extension> <zip|tar.gz>
            mv "out/$1" "out/$2"
            file="$2.$3"
            if [ "$3" = "zip" ]; then
              (cd out && cmake -E tar cf "../dist/${file}" --format=zip "$2")
            else
              tar -C out -czf "dist/${file}" "$2"
            fi
            (cd dist && cmake -E sha256sum "${file}" > "${file}.sha256")
            cat "dist/${file}.sha256"
          }
          extension=tar.gz
          if [ "${{ matrix.os }}" = "windows" ]; then extension=zip; fi
          pack sdk "${WIND_ARTIFACT}" "${extension}"
          pack symbols "wind-sdk-symbols-${WIND_VERSION}-${{ matrix.os }}-${{ matrix.arch }}" "${extension}"
          if [ -d out/source ]; then
            pack source "wind-sdk-source-${WIND_VERSION}" tar.gz
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, sdk]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: dist
      - name: Release
        run: |
          version="${{ needs.version.outputs.version }}"
          ls -l dist
          # Three SDKs, their three symbols packages, and the source, each with its .sha256.
          test "$(ls dist/*.sha256 | wc -l)" = 7
          test "$(ls dist | wc -l)" = 14
          test -f "dist/wind-sdk-symbols-${version}-windows-x86_64.zip"
          test -f "dist/wind-sdk-source-${version}.tar.gz"
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          else
            flags="--latest"
          fi
          gh release create "v${version}" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Wind ${version}" --generate-notes ${flags}
