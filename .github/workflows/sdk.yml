name: SDK

# The editor build and its SDK on every desktop platform: build, engine and editor tests, install, and a game built
# against the installed SDK (tools/ci/sdk_smoke.sh). docs/tech/build/CMake.md

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libgl1-mesa-dri libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
      - name: Configure
        run: cmake --preset linux-editor
      - name: Build
        run: cmake --build build-editor --config Release --parallel -- -k 0
      - name: Tests
        run: xvfb-run -a ctest --test-dir build-editor -C Release --output-on-failure --parallel 4
      - name: Install the SDK
        run: cmake --install build-editor --config Release --prefix out/sdk
      - name: Game against the SDK
        run: tools/ci/sdk_smoke.sh out/sdk out/smoke
      - name: Editor plays the game
        # A CI machine has no sound card: SDL's dummy driver stands in, or the editor refuses to start.
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a tools/ci/sdk_smoke.sh out/sdk out/smoke-e2e --e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: |
            out/smoke*/game/build-editor/CMakeFiles/CMakeConfigureLog.yaml
            out/sdk/bin/game.log
          if-no-files-found: ignore

  macos:
    name: macOS (arm64, Apple Clang)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset macos-editor
      - name: Build
        run: cmake --build build-editor --config Release --parallel -- -k 0
      - name: Tests
        run: ctest --test-dir build-editor -C Release --output-on-failure --parallel 4
      - name: Install the SDK
        run: cmake --install build-editor --config Release --prefix out/sdk
      - name: Game against the SDK
        run: tools/ci/sdk_smoke.sh out/sdk out/smoke
      - name: Editor plays the game
        env:
          SDL_AUDIODRIVER: dummy
        run: tools/ci/sdk_smoke.sh out/sdk out/smoke-e2e --e2e

  windows:
    # tests/cli_server_test.cpp does not compile with Visual Studio 2022's MSVC (C2017 on a raw string with quotes in
    # a macro argument). The repository's presets use Visual Studio 2026, so this job does too.
    name: Windows (MSVC, Visual Studio 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -S . -B build-editor -G "Visual Studio 18 2026" -DENGINE_BUILD_TESTS=ON -DENGINE_WITH_WINDOW=ON
          -DENGINE_WITH_AUDIO=ON -DENGINE_EDITOR=ON
      - name: Build
        run: cmake --build build-editor --config Release --parallel
      - name: Tests
        run: ctest --test-dir build-editor -C Release --output-on-failure --parallel 4

  launcher:
    name: Launcher (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev             libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev             libegl1-mesa-dev libgl1-mesa-dri libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
      - name: Configure
        run: >
          cmake -S . -B build-launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON
          -DENGINE_WITH_WINDOW=ON -DENGINE_WITH_AUDIO=OFF -DENGINE_LAUNCHER=ON
      - name: Build
        run: cmake --build build-launcher --target wind_launcher wind_launcher_tests --parallel -- -k 0
      - name: Tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}build-launcher/bin/wind_launcher_tests
